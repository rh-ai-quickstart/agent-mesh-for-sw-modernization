{{- if .Values.otel.enabled }}
{{- $storage := index .Values "aws-compatible-storage" }}
---
# S3 credentials mirrored into the Tempo namespace for TempoStack → aws-compatible-storage.
apiVersion: v1
kind: Secret
metadata:
  name: tempo-s3-secret
  namespace: {{ .Values.otel.namespace }}
type: Opaque
stringData:
  endpoint: {{ printf "http://%s.%s.svc.cluster.local:%s" (include "agent-mesh.awsCompatibleStorage.fullname" .) .Values.namespace (include "agent-mesh.awsCompatibleStorage.apiPort" .) }}
  bucket: {{ .Values.otel.tempo.bucket }}
  access_key_id: {{ $storage.s3.accessKeyId | quote }}
  access_key_secret: {{ $storage.s3.secretAccessKey | quote }}
---
apiVersion: tempo.grafana.com/v1alpha1
kind: TempoStack
metadata:
  name: {{ .Values.otel.name }}
  namespace: {{ .Values.otel.namespace }}
spec:
  storage:
    secret:
      name: tempo-s3-secret
      type: s3
  storageSize: {{ .Values.otel.tempo.storageSize }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Values.otel.name }}
  namespace: {{ .Values.otel.namespace }}
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      otlp:
        endpoint: tempo-{{ .Values.otel.name }}-distributor:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp]
{{- end }}
