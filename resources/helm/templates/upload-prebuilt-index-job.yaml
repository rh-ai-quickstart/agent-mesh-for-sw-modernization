{{- if .Values.prebuiltIndex.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-prebuilt-index
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pipeline-upload-job
      containers:
        - name: upload-prebuilt-index
          image: {{ .Values.pipelineTools.image.registry }}/{{ .Values.pipelineTools.image.name }}:{{ .Values.pipelineTools.image.tag }}
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              git config --global credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_TOKEN}"; }; f'
              git config --global --add safe.directory /opt/app-root/src
              git init /opt/app-root/src
              git -C /opt/app-root/src remote add origin "{{ .Values.repoUrl }}" 2>/dev/null || true
              git -C /opt/app-root/src fetch --depth=1 origin "{{ .Values.repoRef }}"
              git -C /opt/app-root/src reset --hard FETCH_HEAD
              PYTHONPATH=/opt/app-root/src/workflows/examples \
              python workflows/examples/code_understanding/scripts/upload_prebuilt_index.py \
                --bundle "{{ .Values.prebuiltIndex.bundlePath }}"
          workingDir: /opt/app-root/src
          env:
            - name: MLFLOW_TRACKING_INSECURE_TLS
              value: "true"
            - name: MLFLOW_NAMESPACE
              value: "{{ .Values.namespace }}"
            {{- if .Values.mlflowGatewayHost }}
            - name: MLFLOW_TRACKING_URI
              value: "https://{{ .Values.mlflowGatewayHost }}/mlflow"
            {{- end }}
          envFrom:
            - secretRef:
                name: code-understanding-env
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          emptyDir: {}
{{- end }}
