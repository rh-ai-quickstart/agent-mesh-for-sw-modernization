namespace: demo
requester: ""
kfpHost: ""
clusterDomain: ""
mlflowGatewayHost: ""
deployNotebooks: false

imageStreams:
  enabled: false
  registry: image-registry.openshift-image-registry.svc:5000
  names:
    dataGeneration: custom-data-generation
    graphrag: custom-graphrag
    analysis: custom-analysis

repoUrl: ""
repoRef: main

aws-compatible-storage:
  enabled: true
  fullnameOverride: s4
  image:
    repository: quay.io/rh-aiservices-bu/s4
    tag: "0.3.2"
    pullPolicy: IfNotPresent
  s3:
    accessKeyId: ""
    secretAccessKey: ""
    region: us-east-1
  # The UI is not used by this quickstart; retain the internal /api health endpoint.
  auth:
    enabled: false
  route:
    enabled: false
    s3Api:
      enabled: false
  storage:
    data:
      size: 50Gi

pipelineStorage:
  bucket: demopipelines

applicationStorage:
  bucket: data

awsCompatibleStorageBuckets:
  create: true

jobImages:
  python: registry.redhat.io/ubi9/python-311:latest

dataGeneration:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - Data Generation"
    tag: latest
  notebook:
    name: data-generation
    mlflowInstance: ""

graphrag:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - GraphRAG Indexing"
    tag: latest
  notebook:
    name: graphrag-indexing
    mlflowInstance: ""

analysis:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - Analysis"
    tag: latest
  notebook:
    name: graphrag-analysis

pipelineTools:
  image:
    registry: ""
    name: pipeline-tools
    tag: latest

prebuiltIndex:
  enabled: false
  bundlePath: workflows/examples/code_understanding/assets/prebuilt-indexes/agapebondservant-tic-tac-toe-sample-main-index.tar.gz

adhocQuery:
  run: false
  graphragDir: "graph_rag_app/source"
  useGlobal: "1"
  retryCount: "3"
  jobId: ""
  gitRepo: ""
  gitBranch: "main"
  pipelineRunId: ""

runPipelines:
  run: false
  args: "--single"
  targetPath: "target"
  graphragSourcePath: "graph_rag_app/source"

otel:
  enabled: false
  namespace: ""
  name: ""
  tempo:
    bucket: tempo
    storageSize: 10Gi

rhoaiMcp:
  enabled: false
  image: ""
  imagePullPolicy: IfNotPresent
  authMode: auto
  logLevel: INFO
  readOnly: false
  oidc:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

skillAgent:
  networkPolicy:
    enabled: true
    # Namespace where cluster DNS pods run.
    # OpenShift default: openshift-dns  |  vanilla Kubernetes default: kube-system
    dnsNamespace: openshift-dns
    # Egress ports permitted from skill-agent pods.
    # Adjust if using non-default ports. Object-store egress follows the storage chart;
    # for external storage, set aws-compatible-storage.service.s3Port.
    egressPorts:
      # Backend port of the CoreDNS pods (post-DNAT)
      dns: 5353
      # Kubernetes API server backend port (post-DNAT)
      kubeapi: 6443
      https: 443    # External LLM API endpoint
      mlflow: 8443  # MLflow tracking server (OpenShift AI default)
      mlmd: 8080    # KFP ML Metadata gRPC service (required by KFP executor)
      rhoaiMcp: 8000  # RHOAI MCP server (required when rhoaiMcp.enabled=true)
      otelHttp: 4318  # OpenTelemetry collector HTTP OTLP endpoint
      otelGrpc: 4317  # OpenTelemetry collector gRPC OTLP endpoint

console:
  enabled: false
  replicas: 1
  image: ""
  imagePullPolicy: Always
  route:
    host: ""
  jobScripts:
    enabled: false
    runPipelines: ""
    mlflowAssetLoader: ""
    defaultAssetLoader: ""

consolePlugin:
  enabled: false
  replicas: 1
  image: ""
  imagePullPolicy: IfNotPresent
  apiImage: ""
  apiRouteHost: ""
  applicationMenuSection: OpenShift Self Managed Services
  consoleBaseUrl: ""
  iconDataUri: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSI+PHJlY3Qgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNCIgZmlsbD0iI0M5MTkwQiIvPjxwYXRoIGQ9Ik03IDhoMTB2Mkg3Vjhaem0xMCA0SDd2LTJ6IiBmaWxsPSJ3aGl0ZSIvPjwvc3ZnPg=="
