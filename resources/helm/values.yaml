namespace: demo
requester: ""
kfpHost: ""
clusterDomain: ""
mlflowGatewayHost: ""
deployNotebooks: false

imageStreams:
  enabled: false
  namespace: redhat-ods-applications
  registry: image-registry.openshift-image-registry.svc:5000
  names:
    dataGeneration: custom-data-generation
    graphrag: custom-graphrag
    analysis: custom-analysis

repoUrl: ""
repoRef: main

minio:
  rootUser: ""
  rootPassword: ""
  bucket: demo
  region: us-east-1
  image: "quay.io/minio/minio:latest"
  # The bucket Job downloads a pinned mcli release into /tmp at runtime.
  # This Red Hat base image supplies sh, curl, tar, and sha256sum.
  mcImage: "registry.access.redhat.com/ubi9/ubi:9.7"
  mcRelease: "RELEASE.2026-09-16T00-00-00Z"
  mcArchiveVersion: "20260916000000.0.0"
  mcArchiveSha256:
    amd64: "4ba2814fd5507fbe6b4d237c359750b9119d28d7217495fa5b48002fcbd397ef"
    arm64: "b7008ca2a1bc5735b6585981c59a3640a0daa152dc789df3d1a0d0438787de82"

dataGeneration:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - Data Generation"
    tag: latest
  notebook:
    name: data-generation
    mlflowInstance: ""

graphrag:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - GraphRAG Indexing"
    tag: latest
  notebook:
    name: graphrag-indexing
    mlflowInstance: ""

analysis:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - Analysis"
    tag: latest
  notebook:
    name: graphrag-analysis

pipelineTools:
  image:
    registry: ""
    name: pipeline-tools
    tag: latest

prebuiltIndex:
  enabled: false
  bundlePath: workflows/examples/code_understanding/assets/prebuilt-indexes/agapebondservant-tic-tac-toe-sample-main-index.tar.gz

adhocQuery:
  run: false
  graphragDir: "graph_rag_app/source"
  useGlobal: "1"
  retryCount: "3"
  jobId: ""
  gitRepo: ""
  gitBranch: "main"

runPipelines:
  run: false
  args: "--single"
  targetPath: "target"
  graphragSourcePath: "graph_rag_app/source"

otel:
  enabled: false
  namespace: ""
  name: ""
  createBucket: false
  tempo:
    bucket: tempo
    storageSize: 10Gi

indexWorkspace:
  maxBytes: "5368709120"
  ephemeralStorage:
    request: 10Gi
    limit: 12Gi

console:
  enabled: false
  replicas: 1
  image: ""
  imagePullPolicy: IfNotPresent
  jobScripts:
    enabled: false
    runPipelines: ""
    mlflowAssetLoader: ""
    defaultAssetLoader: ""

consolePlugin:
  enabled: false
  replicas: 1
  image: ""
  imagePullPolicy: IfNotPresent
  apiImage: ""
  apiRouteHost: ""
  applicationMenuSection: OpenShift Self Managed Services
  consoleBaseUrl: ""
