name: Create Version Bump PR

# Run on main with vMAJOR.MINOR.PATCH, or leave version empty for a patch bump.
# Reuses one PR per version changing only BASE_VERSION; merge it to build/push images.
# Enable Actions > General > Allow GitHub Actions to create and approve pull requests.
# Uses GITHUB_TOKEN; generated PR checks may need "Approve workflows to run".
on:
  workflow_dispatch:
    inputs:
      version:
        description: New version (e.g. v0.1.7); leave empty to increment the patch
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-bump-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Update BASE_VERSION
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION=$(python3 .github/scripts/image_version.py)
          NEW_VERSION=$(python3 .github/scripts/image_version.py --bump "$REQUESTED_VERSION")
          echo "previous=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update version bump PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          BRANCH_NAME="chore/bump-base-version-to-$NEW_VERSION"
          TITLE="chore: bump BASE_VERSION to $NEW_VERSION"
          # Replace only the automation branch, and fail if it changes after this read.
          EXPECTED_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH_NAME" | cut -f1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH_NAME"
          git add Makefile
          git commit -m "$TITLE"
          git push --force-with-lease="refs/heads/$BRANCH_NAME:$EXPECTED_SHA" \
            origin "HEAD:refs/heads/$BRANCH_NAME"

          BODY_FILE="$RUNNER_TEMP/version-bump-pr-body.txt"
          printf '%s\n' \
            "Update the default image version from $PREVIOUS_VERSION to $NEW_VERSION." \
            '' \
            'Merging this PR triggers image builds and pushes to Quay.io using the new `BASE_VERSION`.' \
            '' \
            "Requested by @$GITHUB_ACTOR in [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." \
            > "$BODY_FILE"

          PR_NUMBER=$(gh pr list --base main --head "$BRANCH_NAME" --state open \
            --json number --jq '.[0].number // empty')
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "$BODY_FILE"
            PR_URL=$(gh pr view "$PR_NUMBER" --json url --jq '.url')
          else
            PR_URL=$(gh pr create --base main --head "$BRANCH_NAME" \
              --title "$TITLE" --body-file "$BODY_FILE")
          fi
          echo "pull-request-url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Summarize version bump
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: echo "Version bump PR - $PR_URL" >> "$GITHUB_STEP_SUMMARY"
