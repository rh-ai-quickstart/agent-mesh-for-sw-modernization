name: Test agent-mesh-for-sw-modernization

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      run_pipelines:
        description: Run real indexing and analysis-only pipelines
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy and test
        default: main
        type: string
      run_pipelines:
        description: Run real indexing and analysis-only pipelines
        type: boolean
        default: false

concurrency:
  group: agent-mesh-for-sw-modernization-ci-testing
  cancel-in-progress: false

jobs:
  test:
    name: agent-mesh-for-sw-modernization (${{ inputs.branch }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.11"

      - name: Setup and deploy
        uses: ./.github/actions/setup-and-deploy
        timeout-minutes: 60
        with:
          repo_url: https://github.com/${{ github.repository }}
          ref: ${{ inputs.branch }}
          namespace: agent-mesh-for-sw-modernization-ci-project-1
          deploy_command: "make install MANAGE_NAMESPACE=false DEPLOY_EMBEDDING_MODEL=true WAIT_TIMEOUT=10m CUSTOM_EVALUATOR=basic"
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
          PROD_SERVER: ${{ secrets.PROD_SERVER }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GRAPHRAG_LLM_TOKEN: ${{ secrets.GRAPHRAG_LLM_TOKEN }}
          GRAPHRAG_LLM_ID: ${{ vars.GRAPHRAG_LLM_ID }}
          GRAPHRAG_LLM_API_BASE: ${{ vars.GRAPHRAG_LLM_API_BASE }}
          GRAPHRAG_LLM_PROVIDER: ${{ vars.GRAPHRAG_LLM_PROVIDER }}
          GRAPHRAG_LLM_PROVIDER_SETTINGS_XML: ${{ vars.GRAPHRAG_LLM_PROVIDER_SETTINGS_XML }}
          KFP_NAMESPACE: agent-mesh-for-sw-modernization-ci-project-1

      - name: Deploy console app
        run: |
          api_server="$(oc whoami --show-server)"
          api_host="${api_server#*://}"
          api_host="${api_host%%:*}"
          case "$api_host" in
            api.*) route_domain="apps.${api_host#api.}" ;;
            *) echo "Cannot derive the OpenShift ingress domain from API server: $api_server" >&2; exit 1 ;;
          esac

          route_label="code-understanding-console-${KFP_NAMESPACE}"
          while ((${#route_label} > 63)); do
            route_label="${route_label#*-}"
          done

          CONSOLE_ROUTE_HOST="${route_label}.${route_domain}" \
            make deploy-console-app
        working-directory: ./quickstart
        timeout-minutes: 15
        env:
          KFP_NAMESPACE: agent-mesh-for-sw-modernization-ci-project-1

      - name: Run CLI and UI E2E tests
        uses: ./.github/actions/run-quickstart-tests
        timeout-minutes: 240
        with:
          test_command: "make test-e2e RUN_PIPELINES=${{ inputs.run_pipelines }}"
          upload_results: "tests/e2e/ui/test-results"
        env:
          # Supply the external URL without reading Routes in openshift-ingress.
          MLFLOW_GATEWAY_URL: ${{ secrets.MLFLOW_GATEWAY_URL }}
          # apply-secrets must receive the same configuration as installation.
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GRAPHRAG_LLM_TOKEN: ${{ secrets.GRAPHRAG_LLM_TOKEN }}
          GRAPHRAG_LLM_ID: ${{ vars.GRAPHRAG_LLM_ID }}
          GRAPHRAG_LLM_API_BASE: ${{ vars.GRAPHRAG_LLM_API_BASE }}
          GRAPHRAG_LLM_PROVIDER: ${{ vars.GRAPHRAG_LLM_PROVIDER }}
          GRAPHRAG_LLM_PROVIDER_SETTINGS_XML: ${{ vars.GRAPHRAG_LLM_PROVIDER_SETTINGS_XML }}
          DEPLOY_EMBEDDING_MODEL: "true"
          CUSTOM_EVALUATOR: basic
          KFP_NAMESPACE: agent-mesh-for-sw-modernization-ci-project-1

      - name: Cleanup
        if: always()
        uses: ./.github/actions/cleanup
        with:
          cleanup_command: "make uninstall"
        env:
          KFP_NAMESPACE: agent-mesh-for-sw-modernization-ci-project-1

      - name: Clean up MLflow experiments
        if: always()
        working-directory: ./quickstart
        timeout-minutes: 5
        env:
          MLFLOW_GATEWAY_URL: ${{ secrets.MLFLOW_GATEWAY_URL }}
          KFP_NAMESPACE: agent-mesh-for-sw-modernization-ci-project-1
        run: |
          : "${MLFLOW_GATEWAY_URL:?MLFLOW_GATEWAY_URL secret must be set}"
          make clean-mlflow LOCAL_MLFLOW_TRACKING_URI="$MLFLOW_GATEWAY_URL"
