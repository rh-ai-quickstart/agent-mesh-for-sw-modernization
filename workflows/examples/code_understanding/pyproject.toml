[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh-code-understanding"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
test = [
    "kfp==2.17.0",
    "kfp-kubernetes==2.14.3",
    "pytest>=8,<9",
    "pyyaml==6.0.2",
]

[tool.setuptools.packages.find]
namespaces = true
exclude = ["scripts*", "notebooks*", "compiled_pipelines*", "*.egg-info*"]

[tool.setuptools.package-data]
"*" = [
    "*.sh",
    "*.json",
    "*.jsonl",
    "*.yaml",
    "*.yaml.in",
    "*.toml",
    "*.txt",
    "*.md",
    "*.csv",
    "*.tsv",
    "*.xml",
    "*.jinja",
    "*.jinja2",
    "*.j2",
    "*.in",
    "*.html",
    "*.parquet",
]
